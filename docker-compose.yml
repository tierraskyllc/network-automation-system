version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: netauto-postgres
    environment:
      POSTGRES_DB: network_automation
      POSTGRES_USER: netauto
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - netauto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netauto -d network_automation"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: netauto-redis
    command: redis-server --appendonly yes --requirepass redispassword
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - netauto-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HashiCorp Vault (for credential management)
  vault:
    image: vault:1.15
    container_name: netauto-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: myroot
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    networks:
      - netauto-network
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Network Automation API
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: netauto-api
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://netauto:password@postgres:5432/network_automation
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: network_automation
      DATABASE_USER: netauto
      DATABASE_PASSWORD: password
      
      # Redis
      REDIS_URL: redis://:redispassword@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword
      
      # Security
      JWT_SECRET_KEY: your-super-secret-jwt-key-change-this-in-production
      
      # Vault
      VAULT_ENABLED: true
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: myroot
      
      # Application
      ENVIRONMENT: development
      DEBUG: true
      LOG_LEVEL: INFO
      
      # API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_WORKERS: 4
      
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./configs:/app/configs
    networks:
      - netauto-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: netauto-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - netauto-network

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: netauto-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    networks:
      - netauto-network
    depends_on:
      - prometheus

  # Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: netauto-nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    networks:
      - netauto-network
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  netauto-network:
    driver: bridge
