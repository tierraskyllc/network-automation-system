[flake8]
max-line-length = 100
extend-ignore = 
    E203,  # whitespace before ':'
    E501,  # line too long (handled by black)
    W503,  # line break before binary operator
    F401,  # imported but unused (handled by isort)
exclude = 
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    *.egg-info,
    .pytest_cache,
    .mypy_cache,
    migrations,
per-file-ignores =
    __init__.py:F401
    tests/*:S101,S106  # Allow assert statements and hardcoded passwords in tests

[bandit]
exclude_dirs = tests,docs,build,dist
skips = B101,B601
