version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: netauto-postgres-dev
    environment:
      POSTGRES_DB: network_automation
      POSTGRES_USER: netauto
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - netauto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netauto -d network_automation"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: netauto-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - netauto-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # FastAPI Application
  api:
    build:
      context: ../../
      dockerfile: docker/api/Dockerfile.dev
    container_name: netauto-api-dev
    environment:
      - DATABASE_URL=postgresql+asyncpg://netauto:password@postgres:5432/network_automation
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8000"
    volumes:
      - ../../src:/app/src
      - ../../configs:/app/configs
      - ../../logs:/app/logs
    networks:
      - netauto-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # MCP Server
  mcp-server:
    build:
      context: ../../
      dockerfile: docker/mcp/Dockerfile.dev
    container_name: netauto-mcp-dev
    environment:
      - DATABASE_URL=postgresql+asyncpg://netauto:password@postgres:5432/network_automation
      - REDIS_URL=redis://redis:6379/1
      - MCP_SERVER_PORT=8001
    ports:
      - "8001:8001"
    volumes:
      - ../../src:/app/src
      - ../../configs:/app/configs
    networks:
      - netauto-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # LangChain Processor
  langchain:
    build:
      context: ../../
      dockerfile: docker/langchain/Dockerfile.dev
    container_name: netauto-langchain-dev
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MCP_SERVER_URL=http://mcp-server:8001
      - REDIS_URL=redis://redis:6379/2
    volumes:
      - ../../src:/app/src
      - ../../configs:/app/configs
    networks:
      - netauto-network
    depends_on:
      - mcp-server
      - redis
    restart: unless-stopped

  # LangGraph Workflow Engine
  langgraph:
    build:
      context: ../../
      dockerfile: docker/langgraph/Dockerfile.dev
    container_name: netauto-langgraph-dev
    environment:
      - DATABASE_URL=postgresql+asyncpg://netauto:password@postgres:5432/network_automation
      - REDIS_URL=redis://redis:6379/3
      - MCP_SERVER_URL=http://mcp-server:8001
      - LANGCHAIN_SERVICE_URL=http://langchain:8002
    volumes:
      - ../../src:/app/src
      - ../../configs:/app/configs
    networks:
      - netauto-network
    depends_on:
      - postgres
      - redis
      - mcp-server
      - langchain
    restart: unless-stopped

  # Network Layer Service
  network-layer:
    build:
      context: ../../
      dockerfile: docker/network/Dockerfile.dev
    container_name: netauto-network-dev
    environment:
      - DATABASE_URL=postgresql+asyncpg://netauto:password@postgres:5432/network_automation
      - REDIS_URL=redis://redis:6379/4
    volumes:
      - ../../src:/app/src
      - ../../configs:/app/configs
      - ../../logs:/app/logs
    networks:
      - netauto-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    # Network access for device connections
    network_mode: host

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: netauto-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ../../monitoring/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml
      - prometheus_data_dev:/prometheus
    networks:
      - netauto-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: netauto-grafana-dev
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data_dev:/var/lib/grafana
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - netauto-network
    depends_on:
      - prometheus

  # Web UI (Optional - for future implementation)
  web-ui:
    image: nginx:alpine
    container_name: netauto-web-dev
    ports:
      - "3000:80"
    volumes:
      - ../../web-ui/dist:/usr/share/nginx/html
      - ../../web-ui/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - netauto-network
    depends_on:
      - api
    profiles:
      - web-ui

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  prometheus_data_dev:
    driver: local
  grafana_data_dev:
    driver: local

networks:
  netauto-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
